<!doctype html><html lang="zh-Hant-TW"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>鹽風里公聽會（學生版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a county public-notice board over a cadastral map of a fictional coastal village; each lesson is a numbered land parcel. */
:root{
  --paper:#EDF1EC; --sheet:#F8FAF6; --ink:#15212B; --muted:#56636B; --line:#C5CEC4;
  --solar:#2440B0; --solar-soft:#DCE2F7; --pond:#2F7E78; --pond-soft:#D3E8E4;
  --good:#2C7A4B; --warn:#A86A12; --bad:#B03535; --good-soft:#DCEFE2; --warn-soft:#F6E8CF; --bad-soft:#F5DADA;
  --stamp:#B03535;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F161B; --sheet:#162026; --ink:#E2E8E3; --muted:#9AA8AE; --line:#2B3840;
  --solar:#9DB0FF; --solar-soft:#1E2A52; --pond:#6FC2B9; --pond-soft:#14342F;
  --good:#7BCB98; --warn:#E3B25E; --bad:#F08A8A; --good-soft:#163323; --warn-soft:#3A2D12; --bad-soft:#3D1C1C;
  --stamp:#F08A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161B; --sheet:#162026; --ink:#E2E8E3; --muted:#9AA8AE; --line:#2B3840;
  --solar:#9DB0FF; --solar-soft:#1E2A52; --pond:#6FC2B9; --pond-soft:#14342F;
  --good:#7BCB98; --warn:#E3B25E; --bad:#F08A8A; --good-soft:#163323; --warn-soft:#3A2D12; --bad-soft:#3D1C1C;
  --stamp:#F08A8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:clamp(28px,6vw,44px);font-weight:900}
h2{font-size:clamp(22px,4.4vw,30px);font-weight:900}
h3{font-size:19px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);letter-spacing:.04em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
button,.btn{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;line-height:1.4}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--solar);outline-offset:2px}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
button.primary:hover{opacity:.9}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:6px}
button.chip{border-radius:999px;padding:5px 12px;font-size:15px}
button.chip[aria-pressed="true"]{background:var(--solar);border-color:var(--solar);color:var(--sheet)}
button.chip.neg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
textarea,input[type=text],select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);color:var(--ink)}
textarea{min-height:92px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.top .brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.top .brand b{font-family:var(--f-display);font-size:22px;font-weight:900}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--sheet);font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}

/* notice hero */
.notice{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.stamp{position:absolute;right:18px;top:18px;border:3px double var(--stamp);color:var(--stamp);font-family:var(--f-display);font-weight:900;padding:6px 10px;transform:rotate(-8deg);font-size:15px;line-height:1.2;text-align:center;opacity:.85}
.notice .lead{max-width:60ch;margin-top:10px}
.map{width:100%;height:auto;display:block;margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.map .parcel{cursor:pointer}
.map .parcel:hover rect.badge,.map .parcel:focus rect.badge{fill:var(--solar)}
.map .parcel:focus{outline:none}
.map text{font-family:var(--f-body)}
.map{background:#CBD3A3}
.map .parcel:hover rect.badge,.map .parcel:focus rect.badge{fill:var(--solar)}
.map .parcel:hover .tail,.map .parcel:focus .tail{fill:var(--solar)}
.map .rotor{animation:mspin 7s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.map .rotor{animation:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map,:root:not([data-theme="light"]) .post svg{filter:brightness(.86) saturate(.92)}}
:root[data-theme="dark"] .map,:root[data-theme="dark"] .post svg{filter:brightness(.86) saturate(.92)}

.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.chap{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;background:var(--sheet)}
.chap .lot{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chap b{font-family:var(--f-display);font-size:17px}
.chap .state{font-size:13px;color:var(--muted)}
.chap.done .state{color:var(--good);font-weight:700}

/* chapter view */
.chhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.steps button{font-size:13px;padding:4px 10px;border-radius:999px}
.steps button[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps button.ok::before{content:"✓ ";color:var(--good)}
.steps button[aria-current="step"].ok::before{color:var(--paper)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel>.stack{max-width:72ch}
.panel.wide>.stack{max-width:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.q{font-weight:700}
.note{border-left:3px solid var(--solar);padding:8px 12px;background:var(--solar-soft);border-radius:0 var(--r) var(--r) 0;font-size:15px}
.note.pond{border-color:var(--pond);background:var(--pond-soft)}
.law{font-family:var(--f-display);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r);background:var(--paper)}
.law .mono{font-size:12px;color:var(--muted);display:block}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{font-size:14px;padding:8px 4px}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.compare{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:12px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--solar)}
.bar.b i{background:var(--pond)}

.case{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.case h3{font-size:17px}
.case ul{margin:0;padding-left:1.2em}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;background:var(--pond-soft);color:var(--pond);align-self:flex-start}
.tag.s{background:var(--solar-soft);color:var(--solar)}

.matrix{width:100%;border-collapse:collapse;font-size:15px}
.tablewrap{overflow-x:auto}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.matrix th{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:nowrap}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:14px;white-space:nowrap;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="合理"]{background:var(--good);color:var(--sheet)}
.seg button[aria-pressed="true"][data-v="有爭議"]{background:var(--warn);color:var(--sheet)}
.seg button[aria-pressed="true"][data-v="不合理"]{background:var(--bad);color:var(--sheet)}
.seg.lbl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fb{font-size:14px;padding:8px 10px;border-radius:var(--r);margin-top:6px}
.fb.good{background:var(--good-soft);color:var(--ink)} .fb.warn{background:var(--warn-soft);color:var(--ink)} .fb.bad{background:var(--bad-soft);color:var(--ink)}
.fb b{font-weight:700}

/* feed */
.feed{display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:8px}
.post .who{display:flex;gap:10px;align-items:center;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--sheet);background:var(--muted);flex:none;font-size:14px}
.post .meta{color:var(--muted);font-size:12px}
.post .body{font-size:16px}
.post .body strong{font-weight:900}
.post .react{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.sim{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:3px;margin-left:auto}
.post svg{max-width:100%;height:auto;border-radius:4px;display:block}

.report{font-size:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.report .h{background:var(--ink);color:var(--paper);padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.report table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.report td,.report th{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);cursor:pointer}
.check input{margin-top:5px;accent-color:var(--solar)}

/* hearing */
.hall{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;padding:4px}
.say{max-width:86%;display:flex;flex-direction:column;gap:4px}
.say .who{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.say .bub{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.say.me{align-self:flex-end}
.say.me .bub{background:var(--solar-soft);border-color:var(--solar)}
.say.mod .bub{background:transparent;border-style:dashed}
.scores{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.scores span{border:1px solid var(--line);border-radius:3px;padding:1px 6px;background:var(--sheet)}
.scores span b{font-family:var(--f-mono)}
.coach{font-size:13px;color:var(--muted)}
.coach em{font-style:normal;color:var(--ink)}
.thinking{font-size:14px;color:var(--muted);font-style:italic}

.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role{text-align:left;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--paper)}
.role[aria-pressed="true"]{border-color:var(--solar);box-shadow:inset 0 0 0 2px var(--solar);background:var(--sheet)}
.role b{font-family:var(--f-display)}
.role small{color:var(--muted);font-size:13px;line-height:1.5}

.lane{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lane .v{padding:10px 12px;border-radius:var(--r);font-size:15px;border:1px solid var(--line);background:var(--paper);opacity:.25;transition:opacity .4s}
.lane .v.heard{opacity:1}
.lane .v.L{border-left:4px solid var(--good)} .lane .v.R{border-left:4px solid var(--bad);grid-column:2}
.walker{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

.sort{display:flex;flex-direction:column;gap:8px}
.sort .it{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.sort .it>span{min-width:0;flex:1 1 200px}

.breath{width:140px;height:140px;border-radius:50%;border:2px solid var(--pond);display:grid;place-items:center;margin:8px auto;font-family:var(--f-display);font-size:20px;color:var(--pond);transition:transform 4s ease-in-out;background:var(--pond-soft)}
.breath.in{transform:scale(1.25)}
@media (prefers-reduced-motion:reduce){.breath{transition:none}.lane .v{transition:none}}

.cert{border:2px solid var(--ink);border-radius:var(--r);padding:20px;background:var(--sheet);display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--paper)}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
pre.record{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;max-height:300px;overflow:auto}
.sel{display:flex;flex-direction:column;gap:10px}
.sel .item{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sel .lk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sel .lk button{padding:6px 0;font-size:13px}
.sel .lk button[aria-pressed="true"]{background:var(--pond);color:var(--sheet);border-color:var(--pond)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:9}
@media (max-width:560px){.lane{grid-template-columns:1fr}.lane .v.R{grid-column:1}.say{max-width:100%}.stamp{position:static;display:inline-block;margin-bottom:10px}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ DATA ============ */
const EMO_POS=["期待","安心","驕傲","希望","好奇","感激","平靜","被尊重","有力量","樂觀","放心","興奮","認同","踏實","溫暖"];
const EMO_NEG=["擔心","焦慮","生氣","無力","委屈","矛盾","害怕","不安","失望","挫折","煩躁","被忽視","懷疑","難過","內疚"];
const SCALE=["非常反對","有點反對","不確定","有點支持","非常支持"];
const SEL=[
 ["自我覺察","我能說出自己面對爭議時的感受。"],
 ["自我覺察","我能分辨自己的情緒、對事實的判斷與立場。"],
 ["自我管理","看到激動的貼文時，我會先停下來再回應。"],
 ["自我管理","我知道遭遇網路攻擊時如何保護自己。"],
 ["社會覺察","我能說出和我意見不同的人在乎什麼。"],
 ["社會覺察","我能察覺網路或群體的情緒正在影響我的想法。"],
 ["人際技巧","我願意聽完不同意見再回應。"],
 ["人際技巧","我能用「我訊息」說出感受與需求，而不指責他人。"],
 ["負責任決策","我能分辨自己改變想法是因為新的理由，還是當下的感受。"],
 ["負責任決策","面對氣候變遷等無法立即改變的事，我知道自己還能做什麼。"]
];
const SOURCES=["自己的感受","別人的情緒","理由與證據"];
const REGS=["公告期與冷靜期","資訊公開與白話說明","結構化發言順序","逐條回應意見","第三方監測與數據公開"];
const ROLES=[
 {id:"fisher",name:"承租魚塭的漁民",who:"漁民 阿興",care:"能繼續養魚、維持一家生計",fear:"租約被終止，失去做了二十年的工作",
  open:"我租這片魚塭養了二十年虱目魚。地主要把地租給光電業者，租約一到期，我就沒地方養了。我不反對綠能，但從頭到尾有誰來問過我們這些承租的人？",
  reply:"你說得好像大家都有選擇。可是承租的人連通知都沒收到。如果光電一定要做，能不能先保障我們可以繼續養魚，或是有轉業的安排？"},
 {id:"landlord",name:"出租土地的地主",who:"地主 林伯",care:"土地收益與晚年生活保障",fear:"被鄰居說成貪財，和老朋友撕破臉",
  open:"這塊地是我的，租給光電一年的租金比養魚穩定多了。我年紀大了，孩子都在外地。我用自己的土地，難道還要每個人都同意？",
  reply:"我聽得懂大家的擔心，可是我也要過日子。如果要我配合改設計，少掉的收入誰來補？大家能不能也想想我的處境？"},
 {id:"neighbor",name:"擔心噪音的鄰居",who:"鄰居 美玲",care:"家人的睡眠與健康",fear:"晚上睡不好，房子以後也賣不掉",
  open:"最近的風機離我家只有兩百五十公尺。業者說噪音符合標準，可是監測都在白天做。我小孩本來就淺眠，我很擔心晚上那種嗡嗡聲。",
  reply:"我不是反綠能。我只想知道：晚上會不會也測？如果真的吵到睡不著，我可以找誰、多久會處理？"},
 {id:"youth",name:"左右為難的返鄉青年",who:"返鄉青年 小凱",care:"家鄉有工作機會，也保有原本的樣子",fear:"家鄉吵成兩派，自己兩邊都不是人",
  open:"我回來是想讓家鄉有新的機會，業者說會找在地人做維運。可是我爸是養魚的，我阿嬤每天去看黑面琵鷺。我真的不知道該站哪一邊。",

 let pines="";for(let y=6;y<H;y+=7){const x=seaX(y)-40+rnd()*6;pines+=`<circle cx="${x.toFixed(1)}" cy="${y}" r="${(3+rnd()*1.6).toFixed(1)}" fill="${rnd()>.5?"#3F6B44":"#4C7A4E"}"/>`}

function beliefStats(){const c=S.c3,ids=POSTS.filter(p=>p.ans!=="合理擔憂").map(p=>p.id).filter(id=>c.b1[id]!=null&&c.b2[id]!=null);
 if(!ids.length)return null;const m=o=>+(ids.reduce((s,id)=>s+o[id],0)/ids.length).toFixed(1);return {n:ids.length,before:m(c.b1),after:m(c.b2)}}

function fakeImg(){
 /* 擬真風格的「AI 生成」貼文附圖。刻意保留三個破綻：光電板延伸到樹冠上、招牌文字是亂碼、兩組陰影方向相反（太陽在左上）。 */
 let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
 let forest="";for(let i=0;i<170;i++){const x=rnd()*400,y=88+rnd()*120;const yy=y;if(yy<100+Math.abs(x-250)*-.0)continue;const s=2.5+rnd()*4;forest+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(1)}" fill="${["#3E6A3A","#4C7B43","#36603A","#5A8A4B"][Math.floor(rnd()*4)]}"/>`}
 let rows="";
 for(let r=0;r<6;r++){
  const y=104+r*14+r*r*.9,h=8+r*1.6,x0=96-r*12,x1=332+r*9,n=12+r;
  const mw=(x1-x0)/n;
  rows+=`<path d="M${x0} ${(y+h+2).toFixed(1)} L${x1} ${(y+h+2).toFixed(1)}" stroke="#1D2A1C" stroke-opacity=".45" stroke-width="${(2+r*.5).toFixed(1)}"/>`;
  for(let k=0;k<n;k++){const x=x0+k*mw;
   rows+=`<path d="M${(x+1.2).toFixed(1)} ${(y+h).toFixed(1)} L${(x+mw-.4).toFixed(1)} ${(y+h).toFixed(1)} L${(x+mw-.4+2).toFixed(1)} ${y.toFixed(1)} L${(x+1.2+2).toFixed(1)} ${y.toFixed(1)}Z" fill="url(#f-pv)" stroke="#B9C6DC" stroke-width=".5"/>`;
   rows+=`<line x1="${(x+mw/2+.6).toFixed(1)}" y1="${(y+h).toFixed(1)}" x2="${(x+mw/2+1.6).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#8FA3C7" stroke-opacity=".5" stroke-width=".4"/>`;
  }
 }
 /* 破綻一：樹冠上的光電板 */
 const tree=`<g><rect x="58" y="118" width="5" height="40" fill="#5A4632"/><circle cx="60" cy="108" r="24" fill="#3F6B3B"/><circle cx="48" cy="100" r="12" fill="#4F7F47"/><circle cx="72" cy="98" r="11" fill="#4A7843"/>

function localSpeechScore(text,prev){

 const hasWhy=/因為/.test(t),hasWant=/(我希望|希望|請|能不能|可不可以)/.test(t);
 const blame=/(你們都|都是你|自私|騙子|閉嘴|滾)/.test(t);
 const law=/(比例|最小侵害|利益衡平|正當程序|資訊公開|民眾參與|說明理由|聽證)/.test(t);
 const kw=(prev||"").match(/[一-龥]{2}/g)||[];const echo=kw.filter(k=>t.includes(k)&&!["我們","大家","如果","可是","但是","因為"].includes(k)).length;
 const stance=law&&hasWhy?4:hasWhy?3:t.length>15?2:1;
 const emotion=blame?2:hasFeel&&hasWhy&&hasWant?4:hasFeel&&hasWant?3:hasFeel?2:1;
 const empathy=blame?1:(/(我聽到|我理解|你說|你擔心|剛才)/.test(t)&&echo>=2)?4:(echo>=2||/(我聽到|我理解|你說)/.test(t))?3:2;
 const tips=[];if(!hasFeel)tips.push("先說出你的感受");if(!hasWhy)tips.push("補上「因為」");if(!hasWant)tips.push("說出你希望什麼");if(empathy<3)tips.push("先複述上一位的擔憂");if(stance<4&&hasWhy)tips.push("可以引用比例原則或正當程序");
 return {scores:{stance,emotion,empathy},feedback:tips.length?"下一輪試試："+tips.join("、")+"。":"很完整的我訊息，也有回應對方。",example:""};
}

  next={who:String(res.next.role||"主持人"),kind:String(res.next.role).includes("主持")?"mod":"npc",rid:nr?.id,text:String(res.next.text||"")};
 }else{
  const l=localSpeechScore(text,prev?.text);sc=l.scores;fb=l.feedback;ex="";
  if(c.round>=3)next={who:"主持人",kind:"mod",text:"謝謝每一位鄉親。今天大家提到噪音監測、承租漁民的生計、黑面琵鷺的棲地，以及資訊公開。縣府會把所有意見做成紀錄，在會後逐條回覆。"};
  else{const used=new Set(c.log.filter(m=>m.rid).map(m=>m.rid));const order=["neighbor","company","ngo","fisher","gov","youth","landlord"];
   const pick=roleById(order.find(id=>id!==c.role&&!used.has(id))||"gov");next={who:pick.who,kind:"npc",rid:pick.id,text:used.size<3?pick.open:pick.reply};}
 }
 const me=c.log[c.log.length-1];me.sc=sc;me.fb=fb;me.ex=ex;c.scores.push(sc);
 if(next.text)c.log.push(next);save();render();
}
async function metaFb(){
 const c=S.c4,txt=c.meta.trim();const st=$("#meta-status");
 const local=()=>{const emo=/(擔心|害怕|生氣|難過|焦慮|矛盾|不安|委屈|失望|同情|感動|無力|煩躁|心疼|感受|情緒)/.test(txt);
  const link=/(立場|主張|判斷|相信|決定|想法)/.test(txt);const dist=/(感動|說服)/.test(txt);
  const score=emo&&link&&dist?4:emo&&link?3:emo?2:1;
  const t=["還沒看到你的情緒。先寫出今天出現的一個情緒。","你說出了情緒，接著寫它影響了你的哪一個立場或判斷。","你看見情緒影響了立場。再分辨一下：你是被感動，還是被說服？","你能說明情緒如何影響判斷，也分得出被感動與被說服。"][score-1];
  return {score,text:t}};
 if(sample&&claudeState==="on"){st.textContent="Claude 正在閱讀……";
  try{const x=await sample.json(`${SETTING}
學生在公聽會扮演「${roleById(c.role)?.who||"某角色"}」，在良心巷當縣長時，熱決定是「${c.decision||"未選"}」、冷靜後的決定是「${c.cold||"未選"}」，認為最打動自己的那句話改變的是「${c.moved||"未選"}」。
學生的後設覺察反思：「${txt}」
請依規準評「後設覺察」（1–4 的整數）：4=能說明情緒如何影響自己的立場或判斷，並區分被感動與被說服；3=能說出情緒影響了自己的立場；2=能說出情緒，但未連結到立場；1=未覺察。
本課程不把情緒當成理性的干擾，回饋不可暗示情緒是錯的。
只回覆 JSON：{"score":3,"text":"給高中生的具體回饋，先肯定再建議，60 字內"}`);
   c.metaFb={score:Math.max(1,Math.min(4,Math.round(+x.score)||1)),text:String(x.text||"")};}
  catch(e){toast(claudeFail(e));c.metaFb=local()}}
 else c.metaFb=local();
 save();render();
}
async function replyFb(){

 const local=()=>{const bad=/(自私|白痴|笨|滾|閉嘴|你才|斷你|去死)/.test(txt);const q=/[？?]/.test(txt)||/(資料|查證|來源|監測|報告|事實)/.test(txt);const em=/(理解|我聽到|擔心|可能|也許|一起)/.test(txt);
  const ok=!bad&&(q||em);return {ok,text:bad?"回應裡有攻擊人的字眼，會讓衝突升高。試著只談事情，不評價人。":ok?"沒有攻擊對方，也把焦點拉回事實或彼此的擔憂。":"可以加上一個查證的問題，或說出你理解對方在擔心什麼。",tip:bad||!ok?"我也希望減碳，但鄰居擔心的是夜間噪音，有沒有夜間監測的資料可以一起看？":""}};
 if(sample&&claudeState==="on"){st.textContent="Claude 正在閱讀……";
  try{const r=await sample.json(`${SETTING}
學生在網路上看到一則攻擊鄰里居民的留言：「${ATTACK.text}」
學生練習了「暫停、命名情緒（${c.emo.join("、")||"未選"}）、查證、再決定」，寫下回應：「${txt}」
請判斷這則回應是否「不升高衝突」：不攻擊人、不貼標籤、把焦點放回事實或彼此的擔憂、留空間給不同意見。
只回覆 JSON：{"ok":true或false,"text":"給高中生的具體回饋，50 字內","tip":"若 ok 為 false，給一句改寫示範（60 字內），否則空字串"}`);
   c.replyFb={ok:!!r.ok,text:String(r.text||""),tip:String(r.tip||"")};}
  catch(e){toast(claudeFail(e));c.replyFb=local()}}
 else c.replyFb=local();
 save();render();
}
async function swapFb(){

 const local=()=>{const keys=(r.care+r.fear).match(/[一-龥]{2}/g)||[];const hit=keys.filter(k=>txt.includes(k)).length;const me=/我/.test(txt);
  const ok=hit>=1&&me&&txt.length>=25;return {ok,text:ok?`你用第一人稱說出了${r.who}在乎的事。下次可以再加一句他「害怕失去」的東西。`:`試著用「我」來說，並提到${r.who}在乎的「${r.care}」或害怕的「${r.fear}」。`}};

學生在公聽會原本扮演「${roleById(S.c4.role)?.who||"某角色"}」，現在換位扮演意見相反的「${r.who}」（${r.name}；在乎${r.care}；害怕${r.fear}）。學生的 1 分鐘發言：「${txt}」

  catch(e){toast(claudeFail(e));c.swapFb=local()}}
 else c.swapFb=local();
 save();render();
}
async function procFb(){
 const c=S.c5;const st=$("#proc-status");
 const desc=`誰參與：${c.who.join("、")||"未選"}\n何時參與：${c.when.join("、")||"未選"}\n參與方式：${c.how.join("、")||"未選"}\n情緒調節機制：${c.reg.join("、")||"未選"}\n如何讓弱勢與生態被考量：${c.inclusion||"未填"}\n決策如何回應意見：${c.respond||"未填"}`;
 const local=()=>{const inc=/(漁民|承租|弱勢|高齡|生態|琵鷺|棲地|翻譯|到府|交通)/.test(c.inclusion)&&c.inclusion.length>=10;
  const feas=c.when.length>=2&&c.how.length>=2&&c.respond.length>=8;
  const emp=c.who.length>=4;
  const law=/(比例|最小侵害|利益衡平|正當程序|資訊公開|說明理由|聽證)/.test(c.inclusion+c.respond)||c.how.includes("聽證會");
  return {items:[{k:"包容性",ok:inc,t:inc?"有具體機制讓弱勢居民或生態被考量。":"寫出一項具體做法，例如逐戶通知承租漁民、生態調查先於選址。"},
   {k:"可行性",ok:feas,t:feas?"步驟有標出階段、方式與回應方法。":"至少選兩個參與階段、兩種方式，並寫清楚怎麼回應意見。"},
   {k:"同理展現",ok:emp,t:emp?"納入多方利害關係人。":"再多納入幾個受影響的群體，例如承租漁民、保育團體。"},
   {k:"法治連結",ok:law,t:law?"有運用正當程序或比例原則的概念。":"試著寫出你的流程如何做到資訊公開、民眾參與或說明理由。"},
   {k:"調節機制",ok:c.reg.length>=1,t:c.reg.length?"有放入讓決策不被當下情緒主導的設計："+c.reg.join("、")+"。":"至少放入一項，例如公告期與冷靜期、結構化發言順序。"}]}};
 if(sample&&claudeState==="on"){st.textContent="Claude 正在檢視流程……";
  try{const x=await sample.json(`${SETTING}
一組學生為鹽風里設計了綠能選址參與流程：
${desc}

請依「參與流程評分規準」逐項評為「優秀」或「待加強」：
1. 包容性：設計至少一項讓弱勢居民與生態被考量的機制。
2. 可行性：步驟具體，標明參與者、時間與方式。
3. 同理展現：呈現多方利害關係人的需求。
4. 法治連結：正確運用比例原則或正當程序。
5. 調節機制：至少一項讓決策不被當下情緒渲染主導、又能回應居民真實擔憂的設計。
每項給一句具體回饋（45 字內，對高中生說話，待加強時給可行的修改建議）。
只回覆 JSON：{"items":[{"k":"包容性","ok":true,"t":"…"},{"k":"可行性","ok":false,"t":"…"},{"k":"同理展現","ok":true,"t":"…"},{"k":"法治連結","ok":true,"t":"…"},{"k":"調節機制","ok":true,"t":"…"}]}`);
   if(Array.isArray(x.items)&&x.items.length)c.procFb={items:x.items.slice(0,5).map(i=>({k:String(i.k),ok:!!i.ok,t:String(i.t||"")}))};else c.procFb=local();}
  catch(e){toast(claudeFail(e));c.procFb=local()}}
 else c.procFb=local();
 save();render();
}

/* ============ EVENTS ============ */
function setPath(path,val){const k=path.split(".");let o=S;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=val}
function getPath(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],S)}
document.addEventListener("input",e=>{
 const el=e.target;const p=el.dataset.bind;if(!p)return;
 setPath(p,el.dataset.num?+el.value:el.value);save();
 if(el.type==="range"){const b=el.parentElement.querySelector("b");if(b)b.textContent=el.value}
 if(p==="name"||p==="seat"){const h=document.querySelector(".top");if(h)h.outerHTML=header()}
 if(["c3.reply","c5.swap","c4.meta"].includes(p)){const btn=el.closest(".stack").querySelector('[data-act="replyfb"],[data-act="swapfb"],[data-act="metafb"]');if(btn)btn.disabled=el.value.trim().length<(p==="c3.reply"?8:10)}
});
document.addEventListener("change",e=>{
 const el=e.target,a=el.dataset.act;
 if(a==="match"){S.c1.match[el.dataset.k]=el.value;save();render()}
 if(a==="touchsel"){S.c4.touch=el.value;save()}
 if(a==="rep"){const i=+el.dataset.i;const arr=S.c3.rep;const k=arr.indexOf(i);if(k>=0)arr.splice(k,1);else arr.push(i);save();render()}
 if(a==="arrcb"){const arr=getPath(el.dataset.k);const w=el.dataset.w;const k=arr.indexOf(w);if(k>=0)arr.splice(k,1);else arr.push(w);save();render()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".parcel")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT"||el.type==="checkbox")return;
 const a=el.dataset.act,ch=+S.view;
 const go=()=>{save();render()};
 switch(a){
  case "home":S.view="home";go();scrollTo(0,0);break;
  case "open":S.view=el.dataset.ch;go();scrollTo(0,0);break;
  case "step":S.step[ch]=+el.dataset.i;go();break;
  case "next":S.step[ch]++;go();scrollTo(0,0);break;
  case "prev":S.step[ch]--;go();scrollTo(0,0);break;
  case "finish":if(+el.dataset.ch===5&&!S.post.every(x=>x>0)){toast("先完成 SEL 後測");break}markDone(+el.dataset.ch);S.view="home";go();scrollTo(0,0);toast("完成第"+el.dataset.ch+"關");break;
  case "reset":if(el.dataset.confirm){S=blank();try{localStorage.removeItem(KEY)}catch(_){ }go();toast("已清除")}else{el.dataset.confirm="1";el.textContent="再按一次確認清除";setTimeout(()=>{if(el.isConnected){delete el.dataset.confirm;el.textContent="清除紀錄重新開始"}},3000)}break;
  case "sel":S[el.dataset.k][+el.dataset.i]=+el.dataset.v;go();break;
  case "vote":S.c1[el.dataset.k]=+el.dataset.v;go();break;
  case "emo":{const arr=S.c1[el.dataset.k];const w=el.dataset.w;const i=arr.indexOf(w);if(i>=0)arr.splice(i,1);else if(arr.length<3)arr.push(w);else toast("最多選 3 個");go();break}
  case "snap":{const arr=S.c3.snapEmo;const w=el.dataset.w;const i=arr.indexOf(w);if(i>=0)arr.splice(i,1);else if(arr.length<3)arr.push(w);go();break}
  case "arr":{const arr=getPath(el.dataset.k);const w=el.dataset.w;const i=arr.indexOf(w);if(i>=0)arr.splice(i,1);else arr.push(w);go();break}
  case "scene":S.c1.scene=el.dataset.v;go();break;
  case "set":setPath(el.dataset.k,el.dataset.v);if(el.dataset.k==="c5.swapRole")S.c5.swapFb=null;go();break;
  case "tb":S.c2.tb[el.dataset.i]=+el.dataset.v;go();break;
  case "bal":S.c2.bal[el.dataset.k]=el.dataset.v;go();break;
  case "balcheck":S.c2.balChecked=true;go();break;
  case "lab":S.c3.lab[el.dataset.k]=el.dataset.v;go();break;
  case "matchcheck":S.c1.matchChecked=true;go();break;
  case "labcheck":S.c3.labChecked=true;go();break;
  case "repcheck":S.c3.repChecked=true;go();break;
  case "role":if(S.c4.role!==el.dataset.v){S.c4.role=el.dataset.v;S.c4.log=[];S.c4.scores=[];S.c4.round=0}go();break;
  case "speak":el.disabled=true;await speak();break;
  case "walk":S.c4.walk++;go();break;
  case "ctl":S.c5.ctl[el.dataset.i]=el.dataset.v;go();break;
  case "hq":S.c5.hq[el.dataset.i]=+el.dataset.v;go();break;
  case "replyfb":el.disabled=true;await replyFb();break;
  case "swapfb":el.disabled=true;await swapFb();break;
  case "procfb":el.disabled=true;await procFb();break;
  case "metafb":el.disabled=true;await metaFb();break;
  case "breathe":{const b=$("#breath");if(!b)break;el.disabled=true;let n=0;const tick=()=>{if(!b.isConnected)return;if(n>=6){b.textContent="出戲了";b.classList.remove("in");el.disabled=false;return}const inh=n%2===0;b.classList.toggle("in",inh);b.textContent=inh?"吸氣":"吐氣";n++;setTimeout(tick,4000)};tick();break}
  case "copy":{const t=recordText();try{await navigator.clipboard.writeText(t);toast("已複製學習紀錄")}catch(_){const r=document.createRange();r.selectNodeContents($("#record"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取文字，請按複製")}break}
 }
});
render();
